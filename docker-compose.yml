version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citizen_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_TYPE=sqlite
      - GEMINI_MODEL=gemini-flash-lite-latest
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citizen_assistant_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
